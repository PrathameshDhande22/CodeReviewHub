name: Deploy
run-name: Deploy Application - ${{github.run_number}}
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version of the CodeReviewhub to deploy
        required: true
        type: string
      build-image:
        default: true
        description: Build the codereviewhub image and push to ECR
        required: false
        type: boolean
  push:
    tags: "*"
concurrency:
  group: codereviewhub
  cancel-in-progress: true
permissions:
  id-token: write
  contents: read
jobs:
  build-date:
    name: Generate Build Date for Image
    if: ${{inputs.build-image || github.event_name=='push'}}
    runs-on: ubuntu-latest
    outputs:
      image-build-date: ${{steps.build-date.outputs.BUILD_DATE}}
    steps:
      - name: Generate build date
        id: build-date
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%d")
          echo "BUILD_DATE=$BUILD_DATE"
          echo "BUILD_DATE=$BUILD_DATE" >> "$GITHUB_OUTPUT"
  build-image:
    name: Build and Push Image to AWS ECR
    needs: [build-date]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Login to AWS
        id: login-aws
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ap-south-1
          aws-access-key-id: ${{secrets.AWS_KEY}}
          aws-secret-access-key: ${{secrets.AWS_KEY_SECRET}}

      - name: Login in to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: true
          registry-type: private

      - name: Build and Push the Image to ECR
        id: build-push-image
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{secrets.ECR_REGISTRY}}/codereviewhub:${{inputs.version || github.ref_name}}
          context: .
          build-args: |
            BUILD_DATE=${{needs.build-date.outputs.image-build-date}}
            VERSION=${{inputs.version || github.ref_name}}
            GIT_SHA=${{github.sha}}

  deploy:
    name: Deploy to Server
    needs: [build-date, build-image]
    if: ${{!cancelled() && !contains(needs.*.result, 'failure')}}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Copy the Docker Compose File
        id: copy-compose-file
        uses: appleboy/scp-action@v1
        with: 
            username: ${{secrets.SERVER_USERNAME}}
            key: ${{secrets.SERVER_KEY}}
            host: ${{secrets.SERVER_HOST}}
            source: docker-compose.yaml
            target: /home/prathamesh/Production-Configuration/applications/CodeReviewHub

      - name: SSH to Server
        id: ssh-server
        uses: appleboy/ssh-action@v1
        with: 
            host: ${{secrets.SERVER_HOST}}
            key: ${{secrets.SERVER_KEY}}
            username: ${{secrets.SERVER_USERNAME}}
            script: |
                set -o pipefail
                BASE_DIR="/home/prathamesh/Production-Configuration"
                cd $BASE_DIR
                $BASE_DIR/scripts/deploy_application.sh $BASE_DIR/applications/CodeReviewHub CodeReviewHub ${{secrets.ECR_REGISTRY}}
        
    
